[project]
name = "data777"
version = "0.1.0"
description = "Thin Python client for data777 — a direct translation of the HTTP API in docs/api.md, not a second implementation."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data777*"]
